; ERP 调度常驻进程（cron 的替代方案）
;
; 与 cron 方案二选一：
;   A) 用本文件：supervisor 托管 `schedule:work`，开机自启、崩溃自愈，推荐生产使用
;   B) 用 deploy/cron/laravel-erp：系统 cron 每分钟调用 `schedule:run`，配置更简单
;
; 两者同时启用不会重复执行（Laravel 调度本身带互斥），但没必要。

[program:erp-scheduler]
process_name=%(program_name)s_%(process_num)01d
command=php /var/www/laravel12-erp/artisan schedule:work
directory=/var/www/laravel12-erp
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/laravel12-erp/storage/logs/scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=10
