; ERP 队列 Worker（生产）
;
; 安装：
;   sudo cp deploy/supervisor/erp-worker.conf /etc/supervisor/conf.d/
;   sudo sed -i 's#/var/www/laravel12-erp#<实际项目路径>#g' /etc/supervisor/conf.d/erp-worker.conf
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start erp-worker:*
;
; 关键参数说明：
;   --max-time=3600  运行 1 小时后自行退出，由 supervisor 自动拉起，
;                    用于释放长驻 PHP 的内存并载入新代码（改代码无需手工重启）
;   --max-jobs=1000  处理 1000 个任务后退出，双保险
;   --memory=256     单进程内存上限 256MB，超限安全退出
;   stopwaitsecs     必须 >= --max-time，否则 supervisor 会强杀正在执行的任务

[program:erp-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/laravel12-erp/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000 --memory=256
directory=/var/www/laravel12-erp
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/laravel12-erp/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600
